<title>Antidépresseurs en France : synthèse pour prescripteurs</title>
<style>

--s-a-bg:#153A2B;--s-a-ink:#A9E3C7;--s-r-bg:#1B304A;--s-r-ink:#B4D2F2;--s-c-bg:#48310F;--s-c-ink:#F5D9A6;--s-n-bg:#222C36;--s-n-ink:#B7C1CB;--s-nd-ink:#A0ADB9}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
main{max-width:1000px;margin:0 auto;padding:16px 14px 40px;overflow-wrap:anywhere}
h1{font-family:var(--serif);font-size:1.55rem;line-height:1.2;margin:.2rem 0 .4rem;font-weight:700}
h2{font-family:var(--serif);font-size:1.2rem;line-height:1.25;margin:1.8rem 0 .6rem;font-weight:700}
h3{font-size:1rem;margin:1rem 0 .3rem}
p{margin:.4rem 0}
.lead{color:var(--muted);max-width:70ch;margin:0 0 .8rem}
.small{font-size:.86rem;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ctrl{background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
@media (min-width:760px){.ctrl{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}}
.ctrl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{min-height:44px;padding:0 14px;border:0;background:transparent}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0E151C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0E151C}}
.btn{min-height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{min-height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:22px;background:var(--card);display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg);font-weight:600}
.chip .dot{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none;border:2px solid transparent}
.chip[aria-pressed="false"] .dot{opacity:.35}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td,tr:last-child th{border-bottom:0}
thead th{background:var(--card);font-weight:700;white-space:nowrap;position:sticky;top:0}
tbody th{font-weight:600;min-width:130px;position:sticky;left:0;background:var(--card);z-index:1;border-right:1px solid var(--line)}
td.cell{min-width:150px}
.badge{display:inline-block;white-space:nowrap;flex:none;padding:1px 9px;border-radius:12px;font-weight:700;font-size:.8rem;border:1px solid transparent}
.b-A{background:var(--s-a-bg);color:var(--s-a-ink)}
.b-R{background:var(--s-r-bg);color:var(--s-r-ink)}
.b-C{background:var(--s-c-bg);color:var(--s-c-ink)}
.b-N{background:var(--s-n-bg);color:var(--s-n-ink)}
.b-ND{background:transparent;color:var(--s-nd-ink);border:1px dashed var(--muted)}
.note{display:block;color:var(--muted);font-size:.8rem;margin-top:3px;line-height:1.35}
.repere{display:block;font-weight:400;color:var(--muted);font-size:.78rem;margin-top:3px}
.list{display:grid;gap:8px}
.item{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 12px}
.item h3{margin:0 0 4px;font-size:.98rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0;font-size:.84rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.radars{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:760px){.radars.two{grid-template-columns:1fr 1fr}}
.rcard{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:8px 8px 6px}
.rcard h3{margin:4px 6px 0}
.rcard svg{display:block;width:100%;height:auto;max-width:520px;margin:0 auto}
.rcard .rlegend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:2px 6px 6px;font-size:.8rem;color:var(--muted)}
.rlegend i{display:inline-block;width:26px;height:0;border-top:3px solid;vertical-align:middle;margin-right:5px}
details{border:1px solid var(--line);border-radius:10px;background:var(--card);margin:8px 0;padding:0 12px}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
details[open] summary{border-bottom:1px solid var(--line);margin-bottom:8px}
details .body{padding:0 0 10px}
dl{margin:.3rem 0}
dt{font-weight:600;margin-top:.6rem}
dd{margin:.1rem 0 0;color:var(--ink)}
.src-id{font-size:.78rem;color:var(--muted);white-space:nowrap}
ul.plain{margin:.3rem 0;padding-left:1.15rem}
ul.plain li{margin:.25rem 0}
ol.src{padding-left:0;list-style:none;margin:.4rem 0}
ol.src li{margin:.55rem 0;padding-left:3.1rem;position:relative;font-size:.88rem;line-height:1.4}
ol.src li b{position:absolute;left:0;top:0;min-width:2.6rem}
.hyp{border-left:4px solid var(--accent);background:var(--card);padding:6px 14px;border-radius:0 10px 10px 0}
.alert{border:1px solid var(--s-c-ink);border-radius:10px;background:var(--card);padding:10px 12px;margin:8px 0}
.alert h3{margin:0 0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

:root{--pd:#1F4E79;--pk:#8A5A00;--ex:#7A2E63}

h1{font-size:1.6rem}
.tabs{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding:8px 0;margin:6px 0 4px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;min-height:48px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-weight:600;padding:0 6px;line-height:1.2}

:root[data-theme="dark"] .tabs button[aria-selected="true"]{color:#0E151C}

.step{font-family:var(--serif);font-size:1.15rem;font-weight:700;margin:1.2rem 0 .5rem}
.cand{display:grid;gap:8px;margin:8px 0}
.cc{border:1px solid var(--line);border-left-width:6px;border-radius:10px;background:var(--card);padding:9px 12px}
.cc h3{margin:0 0 3px;font-size:1rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gap{background:var(--accent-bg);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.92rem}
.grid{display:grid;grid-template-columns:1fr;gap:14px}

.fcard h3{margin:6px 6px 0;font-size:1.05rem}
.fcard .sub{margin:0 6px 2px;color:var(--muted);font-size:.85rem}
.fcard svg{display:block;width:100%;height:auto;max-width:440px;margin:0 auto}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:2px 6px 4px}
.tags .badge{font-size:.75rem}
.glegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.82rem;margin:6px 0}
.glegend b{font-weight:700}
.g-pd{color:var(--pd)}.g-pk{color:var(--pk)}.g-cv{color:var(--pd)}.g-ex{color:var(--ex)}.g-gr{color:var(--muted)}
.alerts summary{color:var(--s-c-ink);background:var(--s-c-bg);border-radius:10px;padding:0 12px}
.alerts{border-color:var(--s-c-ink)}
.mini{font-size:.82rem;color:var(--muted)}
[hidden]{display:none!important}
</style>

const CONF = RAW.CONF, M = RAW.MOLS, SC = RAW.SC, SRC = RAW.SRC, MX = RAW.MX;
const COL = m => m.color === '#666666' ? 'var(--lab)' : m.color;
const AXK = CONF.axk, AXS = CONF.axs, ISH = CONF.ish, CHIP = CONF.chip, STV = CONF.stv;
const IND = RAW.ROWS.map(r => ({ id: r[0], label: r[1], rep: r[2], src: r[3] }));
const state = { tab: 'sit', ind: 'edm', sitSel: null, fview: 'pd', cmode: 'multi', cmol: ['esc', 'ami', 'mir'] };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const srcTag = a => a && a.length ? '<span class="src-id">[' + a.join(', ') + ']</span>' : '';
const badge = st => '<span class="badge b-' + st + '">' + RAW.STAT[st] + '</span>';

function wrap(t, n) { const out = []; let cur = ''; t.split(' ').forEach(w => { if ((cur + ' ' + w).trim().length > n && cur) { out.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); }); out.push(cur); return out; }

function radar(spec) {
  const W = 420, H = 340, cx = 210, cy = 172, R = 96, n = spec.axes.length, MAX = spec.max;
  const ang = i => -Math.PI / 2 + 2 * Math.PI * i / n;
  const P = (i, v) => [cx + R * (v / MAX) * Math.cos(ang(i)), cy + R * (v / MAX) * Math.sin(ang(i))];
  const f = x => x.toFixed(1);
  let g = '';
  for (let r = 1; r <= MAX; r++) g += '<polygon points="' + spec.axes.map((a, i) => P(i, r).map(f).join(',')).join(' ') + '" fill="none" style="stroke:var(--line)" stroke-width="' + (r === MAX ? 1.4 : 1) + '"/>';
  spec.axes.forEach((a, i) => {
    const e = P(i, MAX); g += '<line x1="' + cx + '" y1="' + cy + '" x2="' + f(e[0]) + '" y2="' + f(e[1]) + '" style="stroke:var(--line)"/>';
    const c = Math.cos(ang(i)), s = Math.sin(ang(i));
    const lx = cx + (R + 14) * c, ly = cy + (R + 14) * s;
    const anchor = c > 0.3 ? 'start' : (c < -0.3 ? 'end' : 'middle');
    const ls = wrap(a.t, 13);
    const y0 = ly + (s > 0.4 ? 8 : (s < -0.4 ? -4 - (ls.length - 1) * 14 : 4 - (ls.length - 1) * 7));
    g += '<text x="' + f(lx) + '" y="' + f(y0) + '" text-anchor="' + anchor + '" font-size="13.5" font-weight="600" class="g-' + a.g + '" style="fill:currentColor">' +
      ls.map((t, j) => '<tspan x="' + f(lx) + '" dy="' + (j ? 14 : 0) + '">' + esc(t) + '</tspan>').join('') + '</text>';
  });
  for (let r = 1; r <= MAX; r++) { const p = P(0, r); g += '<text x="' + f(p[0] + 4) + '" y="' + f(p[1] + 4) + '" font-size="10.5" style="fill:var(--muted)">' + r + '</text>'; }
  spec.series.forEach(se => {
    const pts = se.vals.map((v, i) => P(i, v === null ? 0 : v));
    g += '<polygon data-poly="' + se.m.id + '" points="' + pts.map(p => p.map(f).join(',')).join(' ') + '" style="fill:' + COL(se.m) + ';stroke:' + COL(se.m) + '" fill-opacity="' + (spec.series.length > 2 ? 0.07 : 0.16) + '" stroke-width="2.4" stroke-dasharray="' + se.m.dash + '" stroke-linejoin="round"/>';
    se.vals.forEach((v, i) => { const p = pts[i];
      g += v === null
        ? '<circle cx="' + f(p[0]) + '" cy="' + f(p[1]) + '" r="4.2" style="fill:var(--card);stroke:' + COL(se.m) + '" stroke-width="2"><title>' + esc(se.m.name + ' : ' + spec.axes[i].t + ' non documenté') + '</title></circle>'
        : '<circle cx="' + f(p[0]) + '" cy="' + f(p[1]) + '" r="3.4" style="fill:' + COL(se.m) + '"><title>' + esc(se.m.name + ' : ' + spec.axes[i].t + ' ' + v + '/' + MAX) + '</title></circle>'; });
  });
  const desc = spec.title + ', échelle 0 au centre à ' + MAX + ' au bord. ' + spec.series.map(se => se.m.name + ' : ' + se.vals.map((v, i) => spec.axes[i].t + ' ' + (v === null ? 'non documenté' : v)).join(', ')).join(' ; ');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(spec.title) + '"><desc>' + esc(desc) + '</desc>' + g + '</svg>';
}

const pdSpec = mols => ({ title: CONF.pdTitle, max: 4, axes: AXK.map(k => ({ t: AXS[k][0], g: AXS[k][1] })), series: mols.map(m => ({ m, vals: AXK.map(k => SC[m.id][k][0]) })) });
const indSpec = mols => ({ title: CONF.indTitle, max: 2, axes: IND.map(r => ({ t: ISH[r.id][0], g: ISH[r.id][1] })), series: mols.map(m => ({ m, vals: IND.map(r => STV[MX[r.id][m.id][0]]) })) });
const legend = mols => '<div class="rlegend">' + mols.map(m => '<span><i style="border-color:' + COL(m) + ';border-top-style:' + (m.dash === '0' ? 'solid' : 'dashed') + '"></i>' + esc(m.name) + '</span>').join('') + '</div>';
const pdKey = '<div class="glegend">' + CONF.pdKey + '<span class="mini">0 au centre, 4 au bord ; point creux : non documenté</span></div>';
const indKey = '<div class="glegend">' + CONF.indKey + '<span class="mini">' + CONF.indScale + '</span></div>';

function chipsHTML(items, sel, attr) {
  return '<div class="chips">' + items.map(it => '<button type="button" class="chip" ' + attr + '="' + it.id + '" aria-pressed="' + sel.includes(it.id) + '">' + (it.color ? '<span class="dot" style="background:' + it.color + '"></span>' : '') + esc(it.label) + '</button>').join('') + '</div>';
}

// ---------- Situation ----------
function sitHTML() {
  const r = IND.find(x => x.id === state.ind);
  const cs = M.filter(m => ['A', 'R'].includes(MX[r.id][m.id][0]));
  const order = { A: 0, R: 1 };
  cs.sort((a, b) => order[MX[r.id][a.id][0]] - order[MX[r.id][b.id][0]]);
  const rest = M.filter(m => !cs.includes(m));
  const shown = state.sitSel ? cs.filter(m => state.sitSel.includes(m.id)) : cs.slice(0, 4);
  let h = '<div class="step">1. Situation clinique</div>' + chipsHTML(IND.map(x => ({ id: x.id, label: CHIP[x.id] })), [state.ind], 'data-ind') + '<p class="mini" style="margin-top:8px"><b>' + esc(r.label) + '</b></p>';
  if (r.rep) h += '<p class="mini" style="margin-top:2px">' + esc(r.rep) + ' ' + srcTag(r.src) + '</p>';
  h += '<div class="step">2. Options en France : ' + cs.length + ' molécule' + (cs.length > 1 ? 's' : '') + ' sur ' + M.length + '</div><div class="cand">' +
    cs.map(m => { const c = MX[r.id][m.id]; return '<div class="cc" style="border-left-color:' + COL(m) + '"><h3><span style="color:' + COL(m) + '">&#9632;</span> ' + esc(m.name) + ' ' + badge(c[0]) + '</h3><span class="mini">' + esc(m.cls) + '</span><br>' + esc(c[1]) + ' ' + srcTag(c[2]) + '</div>'; }).join('') + '</div>';
  h += '<div class="step">3. En quoi diffèrent-elles ?</div>';
  if (cs.length > 4) h += '<p class="mini">Radar limité à 4 molécules par défaut : choisir celles à afficher.</p>';
  if (cs.length > 1) h += chipsHTML(cs.map(m => ({ id: m.id, label: m.name, color: COL(m) })), shown.map(m => m.id), 'data-sitmol');
  h += '<div class="rcard" style="margin-top:8px">' + (shown.length ? radar(pdSpec(shown)) + pdKey + legend(shown) : '<p class="small" style="padding:16px">Aucune molécule sélectionnée.</p>') + '</div>';
  if (shown.length > 1) {
    const rng = AXK.map(k => { const v = shown.map(m => SC[m.id][k][0]).filter(x => x !== null); return { k, lo: Math.min(...v), hi: Math.max(...v), n: v.length }; }).filter(x => x.n > 1).sort((a, b) => (b.hi - b.lo) - (a.hi - a.lo));
    if (rng.length && rng[0].hi > rng[0].lo) {
      const top = rng.filter(x => x.hi - x.lo === rng[0].hi - rng[0].lo).map(x => AXS[x.k][0] + ' (score ' + x.lo + ' à ' + x.hi + ')');
      h += '<div class="gap"><b>Écart le plus marqué entre les molécules affichées :</b> ' + esc(top.join(' ; ')) + '.</div>';
    }
  }
  h += '<details><summary>Sans indication citée dans cette situation (' + rest.length + ')</summary><div class="body"><dl>' + rest.map(m => { const c = MX[r.id][m.id]; return '<dt>' + esc(m.name) + ' ' + badge(c[0]) + '</dt><dd>' + esc(c[1]) + ' ' + srcTag(c[2]) + '</dd>'; }).join('') + '</dl></div></details>';
  h += '<details><summary>Avant de prescrire : points à vérifier</summary><div class="body"><ul class="plain">' + CONF.checklist.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul><p class="mini">Note fournie ' + srcTag(['S1']) + '</p></div></details>';
  return h;
}

// ---------- Fiches ----------
function ficHTML() {
  const seg = '<div class="seg" role="group" aria-label="Type de radar"><button type="button" data-fview="pd" aria-pressed="' + (state.fview === 'pd') + '">Tolérance et interactions</button><button type="button" data-fview="ind" aria-pressed="' + (state.fview === 'ind') + '">Empreinte d\u2019indications</button></div>';
  const key = state.fview === 'pd' ? pdKey : indKey;
  const cards = M.map(m => {
    const spec = state.fview === 'pd' ? pdSpec([m]) : indSpec([m]);
    const amm = IND.filter(r => MX[r.id][m.id][0] === 'A').map(r => '<span class="badge b-A">' + esc(ISH[r.id][0]) + '</span>');
    const oth = IND.filter(r => MX[r.id][m.id][0] === 'R').map(r => '<span class="badge b-R">' + esc(ISH[r.id][0]) + '</span>');
    const d = RAW.DOSES.find(x => x[0] === m.id);
    const als = RAW.ALERTS.filter(a => a[3].includes(m.id));
    return '<article class="fcard" style="--c:' + COL(m) + '"><h3>' + esc(m.name) + '</h3><p class="sub">' + esc(m.cls) + '</p>' + radar(spec) +
      '<div class="tags" aria-label="Indications AMM">' + (amm.length ? amm.join('') : '<span class="mini">Aucune AMM dans les situations couvertes</span>') + '</div>' +
      (oth.length ? '<div class="tags" aria-label="Cité par la note">' + oth.join('') + '<span class="mini">cité par la note, AMM non vérifiée</span></div>' : '') +
      '<details><summary>Pharmacocinétique et précautions</summary><div class="body"><p><b>Demi-vie :</b> ' + esc(SC[m.id].t12[2]) + '</p><p><b>Métabolisme :</b> ' + esc(RAW.PK[m.id].met) + '</p><p><b>Points cliniques :</b> ' + esc(RAW.PK[m.id].part) + ' ' + srcTag(RAW.PK[m.id].src) + '</p></div></details>' +
      '<details><summary>Posologie (sources retenues)</summary><div class="body"><p>' + esc(d[1]) + ' ' + srcTag(d[2]) + '</p></div></details>' +
      als.map(a => '<div class="alert"><h3>' + esc(a[0]) + '</h3><p class="mini" style="color:var(--ink)">Voir « Alertes en vigueur » en haut de page ' + srcTag(a[2]) + '</p></div>').join('') + '</article>';
  }).join('');
  return '<div class="step">Une fiche par molécule</div>' + seg + key + '<div class="grid g3" style="margin-top:8px">' + cards + '</div>';
}

// ---------- Comparer ----------
function cmpHTML() {
  const mols = M.filter(m => state.cmol.includes(m.id));
  const seg = '<div class="ctrl-row"><div class="seg" role="group" aria-label="Mode"><button type="button" data-cmode="multi" aria-pressed="' + (state.cmode === 'multi') + '">Plusieurs molécules</button><button type="button" data-cmode="one" aria-pressed="' + (state.cmode === 'one') + '">Une seule</button></div><button type="button" class="btn" id="btn-all">Tout afficher</button></div>';
  const chips = chipsHTML(M.map(m => ({ id: m.id, label: m.name, color: COL(m) })), state.cmol, 'data-cmol');
  let h = '<div class="step">Superposer des molécules</div>' + seg + chips;
  if (!mols.length) return h + '<p class="mini" style="margin-top:10px">Aucune molécule sélectionnée : choisir au moins une molécule.</p>';
  h += '<div class="grid" style="margin-top:10px"><div class="rcard"><h3>' + esc(CONF.pdTitle) + '</h3>' + radar(pdSpec(mols)) + pdKey + legend(mols) + '</div>' +
    '<div class="rcard"><h3>' + esc(CONF.indTitle) + '</h3>' + radar(indSpec(mols)) + indKey + legend(mols) + '</div></div>';
  h += '<details><summary>Valeurs, fourchettes et règles de conversion</summary><div class="body"><dl>' + AXK.map(k => '<dt>' + esc(AXS[k][0]) + '</dt><dd class="mini">' + esc(RAW.AXES[k].rule) + '</dd><dd>' + mols.map(m => { const s = SC[m.id][k]; return '<div><b style="color:' + COL(m) + '">' + esc(m.name) + '</b> ' + (s[0] === null ? 'n.d.' : s[0] + '/4') + ' : ' + esc(s[2]) + (s[3] ? ' <span class="mini">(' + esc(s[3]) + ')</span>' : '') + ' ' + srcTag(s[4]) + '</div>'; }).join('') + '</dd>').join('') + '</dl></div></details>';
  return h;
}

// ---------- Pied de page ----------
function alertsHTML() {
  return '<details class="alerts"><summary>' + esc(CONF.alertSummary) + '</summary><div class="body">' +
    RAW.ALERTS.map(a => '<div class="alert"><h3>' + esc(a[0]) + '</h3><p>' + esc(a[1]) + ' ' + srcTag(a[2]) + '</p></div>').join('') + '</div></details>';
}
function readHTML() {
  return '<details><summary>Comment lire un radar</summary><div class="body"><ul class="plain">' + CONF.read.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul></div></details>';
}
function limitsHTML() {
  const div = '<div class="wrap"><table><thead><tr><th>Point</th><th>Valeurs selon les sources</th><th>Traitement retenu</th><th>Sources</th></tr></thead><tbody>' +
    RAW.DIVERG.map(d => '<tr><th scope="row">' + esc(d[0]) + '</th><td class="cell" style="min-width:240px">' + esc(d[1]) + '</td><td class="cell" style="min-width:220px">' + esc(d[2]) + '</td><td class="cell" style="min-width:90px">' + srcTag(d[3]) + '</td></tr>').join('') + '</tbody></table></div>';
  const sel = '<dl>' + RAW.SELECTION.map(s => '<dt>' + esc(s[0]) + '</dt><dd>' + esc(s[1]) + ' <span class="mini">' + esc(s[2]) + '</span></dd>').join('') + '</dl><h3>Non retenus</h3><dl>' + RAW.EXCLUS.map(s => '<dt>' + esc(s[0]) + '</dt><dd>' + esc(s[1]) + '</dd>').join('') + '</dl>';
  return '<h2 id="hyp-t">Hypothèse</h2><div class="hyp"><ul class="plain">' + RAW.HYPOTHESES.map(h => '<li>' + esc(h) + '</li>').join('') + '</ul></div>' +
    '<h2>Divergences entre sources</h2>' + div +
    '<details><summary>Périmètre et sélection des cinq groupes (' + CONF.selRefs + ')</summary><div class="body">' + sel + '</div></details>';
}
function sourcesHTML() {
  const txt = ($('#panels').textContent + ' ' + $('#top').textContent + ' ' + $('#limits').textContent);
  const ids = Array.from(new Set(txt.match(/S\d{1,2}(?!\d)/g) || [])).sort((a, b) => +a.slice(1) - +b.slice(1));
  return '<h2 id="sources">Sources</h2><ol class="src">' + ids.map(id => '<li><b>' + id + '</b>' + esc(SRC[id] || 'SOURCE INCONNUE') + '</li>').join('') + '</ol>';
}

function render() {
  const a = document.activeElement;
  const attrs = ['data-ind', 'data-fview', 'data-cmode', 'data-cmol', 'data-sitmol'];
  const key = a && a.hasAttribute ? (attrs.map(k => a.hasAttribute(k) ? '[' + k + '="' + a.getAttribute(k) + '"]' : '').find(x => x) || (a.id === 'btn-all' ? '#btn-all' : '')) : '';
  $('#p-sit').innerHTML = sitHTML(); $('#p-fic').innerHTML = ficHTML(); $('#p-cmp').innerHTML = cmpHTML();
  ['sit', 'fic', 'cmp'].forEach(t => { $('#p-' + t).hidden = state.tab !== t; $('#t-' + t).setAttribute('aria-selected', state.tab === t); $('#t-' + t).tabIndex = state.tab === t ? 0 : -1; });
  $('#sources-box').innerHTML = sourcesHTML();
  if (key) { const n = document.querySelector(key); if (n) n.focus(); }
}

function init() {
  document.title = CONF.title;
  $('#app').innerHTML =
    '<div id="top"><h1>' + esc(CONF.title) + '</h1><p class="lead">' + esc(CONF.lead) + '</p>' + alertsHTML() + readHTML() + '</div>' +
    '<div class="tabs" role="tablist" aria-label="Vues">' +
      '<button type="button" role="tab" id="t-sit" data-tab="sit" aria-controls="p-sit">Par situation</button>' +
      '<button type="button" role="tab" id="t-fic" data-tab="fic" aria-controls="p-fic">Fiches</button>' +
      '<button type="button" role="tab" id="t-cmp" data-tab="cmp" aria-controls="p-cmp">Comparer</button></div>' +
    '<div id="panels"><section id="p-sit" role="tabpanel" aria-labelledby="t-sit"></section><section id="p-fic" role="tabpanel" aria-labelledby="t-fic" hidden></section><section id="p-cmp" role="tabpanel" aria-labelledby="t-cmp" hidden></section></div>' +
    '<div id="limits">' + limitsHTML() + '</div><div id="sources-box"></div>';
  render();
  document.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.tab) state.tab = b.dataset.tab;
    else if (b.dataset.ind) { state.ind = b.dataset.ind; state.sitSel = null; }
    else if (b.dataset.sitmol) {
      const r = IND.find(x => x.id === state.ind);
      const cs = M.filter(m => ['A', 'R'].includes(MX[r.id][m.id][0]));
      const cur = state.sitSel || cs.slice(0, 4).map(m => m.id); const id = b.dataset.sitmol;
      state.sitSel = cur.includes(id) ? cur.filter(x => x !== id) : cs.map(m => m.id).filter(x => cur.includes(x) || x === id);
    }
    else if (b.dataset.fview) state.fview = b.dataset.fview;
    else if (b.dataset.cmode) { state.cmode = b.dataset.cmode; if (state.cmode === 'one') state.cmol = [state.cmol[0] || M[0].id]; }
    else if (b.id === 'btn-all') { state.cmode = 'multi'; state.cmol = M.map(m => m.id); }
    else if (b.dataset.cmol) { const id = b.dataset.cmol;
      if (state.cmode === 'one') state.cmol = [id];
      else state.cmol = state.cmol.includes(id) ? state.cmol.filter(x => x !== id) : M.map(m => m.id).filter(x => state.cmol.includes(x) || x === id); }
    else return;
    render();
  });
  document.querySelector('.tabs').addEventListener('keydown', e => {
    const t = ['sit', 'fic', 'cmp']; const i = t.indexOf(state.tab);
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { state.tab = t[(i + (e.key === 'ArrowRight' ? 1 : 2)) % 3]; render(); $('#t-' + state.tab).focus(); }
  });
}

window.__selfTest = function () {
  const r = { errors: [] }; const err = m => r.errors.push(m);
  M.forEach(m => { AXK.forEach(k => { const s = SC[m.id][k]; if (!s) return err('score manquant ' + m.id + k); if (s[0] !== null && !(s[0] >= 0 && s[0] <= 4)) err('hors échelle ' + m.id + k); s[4].forEach(x => { if (!SRC[x]) err('source inconnue ' + x); }); });
    IND.forEach(i => { const c = MX[i.id] && MX[i.id][m.id]; if (!c) err('matrice incomplète ' + i.id + m.id); else c[2].forEach(x => { if (!SRC[x]) err('source inconnue ' + x); }); });
    if (!RAW.PK[m.id]) err('PK manquant ' + m.id); if (!RAW.DOSES.find(d => d[0] === m.id)) err('dose manquante ' + m.id); });
  const txt = $('#panels').textContent + ' ' + $('#top').textContent + ' ' + $('#limits').textContent;
  const shown = new Set(txt.match(/S\d{1,2}(?!\d)/g) || []); const listed = new Set(Array.from(document.querySelectorAll('ol.src li b')).map(b => b.textContent));
  shown.forEach(x => { if (!listed.has(x)) err('cité non listé ' + x); if (!SRC[x]) err('source inconnue ' + x); });
  listed.forEach(x => { if (!shown.has(x)) err('listé non cité ' + x); });
  r.listed = Array.from(listed);
  r.polys = { sit: document.querySelectorAll('#p-sit svg polygon[data-poly]').length, fic: document.querySelectorAll('#p-fic svg polygon[data-poly]').length, cmp: document.querySelectorAll('#p-cmp svg polygon[data-poly]').length };
  r.svgs = document.querySelectorAll('svg[role="img"]').length;
  return r;
};
init();
</script>
</body>
</html>
